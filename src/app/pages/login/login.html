<div class="login-container">
  <div class="login-card">
    <h2>Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Phone</label>
        <input type="text" formControlName="username" placeholder="enter your phone number" />
        <span class="error" *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid">
          Please enter a valid cell number
        </span>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="********" />
        <span class="error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          Password is required (minimum 6 characters)
        </span>
      </div>

      <div class="server-error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="loginForm.invalid || isLoading">
        {{ isLoading ? 'Authenticating...' : 'Sign In' }}
      </button>
    </form>
  </div>
</div>
