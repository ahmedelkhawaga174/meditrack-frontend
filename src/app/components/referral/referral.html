<div class="p-6 bg-slate-50 min-h-screen">
  <div class="max-w-2xl mx-auto space-y-6">

    <div class="border-b border-slate-200 pb-4 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Create Patient Referral</h1>
        <p class="text-sm text-slate-500 mt-1">
          Initiating referral for Appointment #{{ appointmentId() }}
        </p>
      </div>
      <a routerLink="/doctors/1/patients" class="text-sm font-medium text-slate-600 hover:text-slate-900">
        &larr; Back to Patient List
      </a>
    </div>

    @if (successMessage()) {
      <div class="p-4 text-sm text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-lg">
        {{ successMessage() }}
      </div>
    }

    @if (errorMessage()) {
      <div class="p-4 text-sm text-red-800 bg-red-50 border border-red-200 rounded-lg">
        {{ errorMessage() }}
      </div>
    }

    <form [formGroup]="referralForm" (ngSubmit)="onSubmit()" class="bg-white p-6 rounded-xl border border-slate-200 space-y-4 shadow-sm">

      <div>
        <label for="referredToDoctorId" class="block text-sm font-semibold text-slate-700 mb-1">
          Select Receiving Doctor *
        </label>
        <select
          id="referredToDoctorId"
          formControlName="referredToDoctorId"
          class="w-full p-3 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none"
        >
          <option value="" disabled>Select a target specialist...</option>
          @for (doc of doctors(); track doc.id) {
            <option [value]="doc.id">
              Dr. {{ doc.firstName }} {{ doc.lastName }}
            </option>
          }
        </select>
      </div>

      <div>
        <label for="reason" class="block text-sm font-semibold text-slate-700 mb-1">
          Reason for Referral *
        </label>
        <input
          id="reason"
          type="text"
          formControlName="reason"
          placeholder="e.g., Requires specialized cardiac consultation"
          class="w-full p-3 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none"
        />
      </div>

      <div>
        <label for="notes" class="block text-sm font-semibold text-slate-700 mb-1">
          Additional Clinical Notes
        </label>
        <textarea
          id="notes"
          rows="3"
          formControlName="notes"
          placeholder="Add secondary findings or patient medical notes..."
          class="w-full p-3 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none resize-none"
        ></textarea>
      </div>

      <div class="flex justify-end pt-2">
        <button
          type="submit"
          [disabled]="isSubmitting() || referralForm.invalid"
          class="px-5 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg disabled:opacity-50 transition-all shadow-sm"
        >
          {{ isSubmitting() ? 'Submitting...' : 'Confirm Referral' }}
        </button>
      </div>

    </form>

  </div>
</div>
